name: Deploy Javadoc to GitHub Pages

on:
  push:
    branches:
      - data  # Запускати при кожному пуші в гілку main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Generate Javadoc
        # Переходимо в папку з pom.xml та генеруємо документацію
        run: |
          cd stockManagementBackend/stockManagementBackend
          chmod +x mvnw
          ./mvnw javadoc:javadoc

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          # Maven генерує документацію в цю папку
          folder: stockManagementBackend/stockManagementBackend/target/site/apidocs
          branch: gh-pages # Гілка для хостингу сайту